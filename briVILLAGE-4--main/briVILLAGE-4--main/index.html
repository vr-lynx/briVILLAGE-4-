<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriVillage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="./image 3.png" alt="">
            </div>
            <div class="header_nav">
                <ul>
                    <li>Главная</li>
                    <li>Номера</li>
                    <li>Услуги</li>
                    <li>О нас</li>
                    <li>Контакты</li>
                </ul>
            </div>
            <div class="header-nav_right">
                <div class="header_phonenumber">
                    <img src="./1564515_call_device_mobile_phone_smartphone_icon 1.png" alt="">
                    <a href="">+7 995 383 16 16</a>
                </div>
                <button>ЗАБРОНИРОВАТЬ</button>
            </div>
            <div class="burger_menu">
                <button><img src="./menu.png" alt=""></button>
            </div>
        </nav>
    </header>
    <section class="first_page">
        <button><img src="./Button.png" alt=""></button>
        <div class="main_title">
            <div class="maintitle_text">
                <h1>Глэмпинг в Казани</h1>
                <h2>на холмистых склонах в окружении соснового бора <br> с красивым голубым небом</h2>
            </div>
            <div class="book_btn">
                <button>ЗАБРОНИРОВАТЬ ДОМИК<img src="./928424_annual_appointment_calendar_day_month_icon 1.png" alt=""></button>
                <img src="./Pagination Lines.png" alt="">
            </div>
        </div>
        <button><img src="./Button2.png" alt=""></button>
    </section>
    <section class="book_sec">
        <div class="booksec_title">
            <h2>Забронировать домик</h2>
        </div>
        <div class="book_card">
            <div class="book_card2">
                <h3>ЗАЕЗД</h3>
                <div class="mini_bookcard">
                    <p>22.10.2023</p>
                    <img src="./928424_annual_appointment_calendar_day_month_icon 1.png" alt="">
                </div>
            </div>
            <div class="book_card2">
                <h3>ВЫЕЗД</h3>
                <div class="mini_bookcard">
                    <p>23.10.2023</p>
                    <img src="./928424_annual_appointment_calendar_day_month_icon 1.png" alt="">
                </div>
            </div>
            <div class="book_card2">
                <h3>КОЛИЧЕСТВО ГОСТЕЙ</h3>
                <div class="mini_bookcard">
                    <p>2 взрослых, 0 детей</p>
                    <img src="./user.png" alt="">
                </div>
            </div>
            <button>ЗАБРОНИРОВАТЬ</button>
        </div>
    </section>
</body>
</html>
